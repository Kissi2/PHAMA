<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Le Trésorier</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Le Trésorier — gestion de trésorerie, caisses et factures fournisseurs pour les pharmacies en Côte d'Ivoire." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,800&display=swap" rel="stylesheet" />

    <!-- Appliqué avant le rendu Angular pour éviter un flash (thème + état des animations) -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try { if (localStorage.getItem('theme') === 'dark') root.classList.add('dark'); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
