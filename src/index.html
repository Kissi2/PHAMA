<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Journal de trésorerie, caisses, factures fournisseurs et analyses financières, pensé pour les pharmacies en Côte d'Ivoire." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Active les animations d'apparition (.js .rv) avant le rendu Angular.
         Au chargement / rafraîchissement : toujours repartir du haut de la page
         (pas de restauration de la position de défilement, ancre #… retirée de l'URL). -->
    <script>
      document.documentElement.classList.add('js');
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      window.scrollTo(0, 0);
    </script>
  </head>

    <app-root></app-root>
  </body>
</html>
