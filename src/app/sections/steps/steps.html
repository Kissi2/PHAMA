<section class="bg-navy on-dark" id="etapes">
  <div class="container-x steps-inner">
    <div class="steps-head">
      <span class="eyebrow reveal">Prise en main</span>
      <h2 class="h-2 reveal sec-title">Opérationnel en une journée.</h2>
    </div>

    <div class="pg-steps" appStagger="0.12">
      @for (step of steps; track step.name; let i = $index) {
        <div class="pg-step reveal">
          <div class="pg-step-num">{{ num(i) }}</div>
          <div class="pg-step-name">{{ step.name }}</div>
          <div class="pg-step-desc">{{ step.desc }}</div>
        </div>
      }
    </div>
  </div>
</section>
