<section class="section" id="chiffres">
  <div class="container-x">
    <div class="sec-head">
      <div>
        <span class="eyebrow reveal">En chiffres</span>
        <h2 class="h-2 reveal sec-title">Un outil conçu<br />pour le terrain.</h2>
      </div>
      <a href="#fonctionnalites" class="btn btn-line reveal">
        Explorer les modules
        <i><svg appIcon="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg></i>
      </a>
    </div>

    <div class="pg-nums" appStagger="0.1">
      @for (stat of stats; track stat.label) {
        <div class="pg-num-cell reveal">
          <div class="pg-bignum" [appCountUp]="stat.value">{{ stat.value }}</div>
          <div class="pg-num-label">{{ stat.label }}</div>
        </div>
      }
    </div>
  </div>
</section>
