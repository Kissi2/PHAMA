<section id="comparer">
  <div class="compare-intro">
    <div class="container-x">
      <span class="eyebrow reveal">Avant / Après</span>
      <h2 class="h-2 reveal sec-title">Ce que ça change, concrètement.</h2>
    </div>
  </div>

  <div class="pg-compare" appStagger="0.1">
    <div class="pg-compare-side pg-compare-before on-dark reveal-left reveal">
      <div class="pg-compare-title">Sans Le Trésorier</div>
      @for (item of before; track item) {
        <div class="pg-compare-item">
          <svg class="pg-compare-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2">
            <circle cx="12" cy="12" r="9" /><path d="M15 9l-6 6M9 9l6 6" />
          </svg>
          {{ item }}
        </div>
      }
    </div>

    <div class="pg-compare-side pg-compare-after reveal-right reveal">
      <div class="pg-compare-title">Avec Le Trésorier</div>
      @for (item of after; track item) {
        <div class="pg-compare-item">
          <svg class="pg-compare-icon" viewBox="0 0 24 24" fill="none" stroke="var(--color-brand)" stroke-width="2">
            <circle cx="12" cy="12" r="9" /><path d="M8 12l3 3 5-5" />
          </svg>
          {{ item }}
        </div>
      }
    </div>
  </div>
</section>
