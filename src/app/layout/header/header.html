<a href="#main" class="skip-link">Aller au contenu</a>

<header class="site-header" [class.is-scrolled]="scrolled()" [class.is-hidden]="hidden()">
  <div class="nav-shell">
    <div class="nav-row container-x nav-row--full">
      <a href="#" class="logo nav-logo" aria-label="Le Trésorier — accueil">
        <svg class="logo-mark" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="3" fill="currentColor" opacity=".25" />
          <path d="M7 12h10M7 8h7M7 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>Le Trésorier
      </a>

      <nav class="nav-links" aria-label="Navigation principale">
        @for (link of links; track link.href) {
          <a class="nav-a" [href]="link.href" [attr.aria-current]="active() === link.href ? 'page' : 'false'">
            {{ link.label }}
          </a>
        }
      </nav>

      <div class="nav-actions">
        <a href="#contact" class="btn btn-sm hide-sm">
          Demander une démo
          <i><svg appIcon="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg></i>
        </a>
        <button
          #burger
          class="icon-btn only-mobile"
          aria-label="Ouvrir le menu"
          aria-controls="mobile-menu"
          [attr.aria-expanded]="menu.open()"
          (click)="menu.toggle()"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu" aria-label="Menu mobile" [class.open]="menu.open()">
  @for (link of links; track link.href) {
    <a class="mm-link" [href]="link.href" (click)="menu.close()">{{ link.label }}</a>
  }
  <div class="mm-cta">
    <a href="#contact" class="btn btn-line mm-btn" (click)="menu.close()">
      Demander une démo
      <i><svg appIcon="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg></i>
    </a>
  </div>
</div>

<div class="scroll-progress" aria-hidden="true" [style.--progress]="progress()"></div>
